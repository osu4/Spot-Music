<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музыка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fg:#fff;--dim:rgba(255,255,255,.6);--faint:rgba(255,255,255,.28);--red:#fa233b;--line:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color:var(--fg);background:#1c1c1e;overflow:hidden;font-size:14px}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
#bg{transition:opacity .5s;position:fixed;inset:-120px;background:#2a2a2e center/cover;filter:blur(80px) saturate(1.6);transform:scale(1.15)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.62)}
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:17px;line-height:1.5;color:var(--dim);background:#1c1c1e}
.pill{background:var(--red);color:#fff;border:0;border-radius:999px;padding:11px 26px;font-weight:600;cursor:pointer}
#cid{width:min(420px,90vw);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
#app{position:relative;display:grid;grid-template-columns:240px 1fr;height:calc(100% - 84px)}
#side{padding:18px 12px;overflow:auto;background:rgba(28,28,30,.5);backdrop-filter:blur(30px);border-right:1px solid var(--line)}
#q{width:100%;padding:9px 12px;border-radius:9px;border:0;background:rgba(255,255,255,.1);margin-bottom:14px}
#side a{display:block;padding:8px 10px;border-radius:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side a:hover{background:rgba(255,255,255,.07)}
#side a.on{background:rgba(255,255,255,.12);color:var(--red)}
#side h3{font-size:13px;color:var(--dim);font-weight:600;margin:18px 10px 6px}
#view{overflow:auto;padding:30px 38px 50px}
h1{font-size:30px;font-weight:700;margin-bottom:18px}
h2{font-size:21px;font-weight:700;margin:30px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 18px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333;box-shadow:0 8px 20px rgba(0,0,0,.35);margin-bottom:8px;display:block}
.card.round img{border-radius:50%}
.card.round{text-align:center}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--dim);font-size:13px}
.row{display:grid;grid-template-columns:44px 1fr auto 28px;gap:12px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.row:hover,.row:focus-visible{background:rgba(255,255,255,.09);outline:0}
.row .n{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row img{width:44px;height:44px;border-radius:5px;display:block;object-fit:cover;background:#333}
.row div{min-width:0}
.row div b,.row div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row div span{color:var(--dim);font-size:13px}
.row time{color:var(--dim);font-variant-numeric:tabular-nums}
.row .q{opacity:0;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--dim);border-radius:6px}
.row:hover .q,.row:focus-within .q{opacity:1}
.row .q:hover{color:#fff;background:rgba(255,255,255,.12)}
.right #like{font-size:22px;line-height:1;padding:4px 8px;background:none}
.right #like.on{color:var(--red)}
.head{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
.head img{width:230px;height:230px;border-radius:12px;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#333}
.head.round img{border-radius:50%}
.head h1{margin:0 0 6px;font-size:34px}
.head p{color:var(--dim);margin-bottom:16px}
.msg{color:var(--dim);line-height:1.5}
#dock{position:fixed;left:0;right:0;bottom:0;height:84px;z-index:30;display:grid;grid-template-columns:1fr minmax(300px,520px) 1fr;gap:16px;align-items:center;padding:0 20px;background:rgba(28,28,30,.72);backdrop-filter:blur(30px);border-top:1px solid var(--line)}
#mini{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
#bArt{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#333;flex:none;transition:opacity .35s}
#mini div{min-width:0}
#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini span{color:var(--dim);font-size:13px}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px}
.ctl button{background:none;border:0;cursor:pointer;padding:4px;border-radius:50%;display:grid;place-items:center}
.ctl button:active{transform:scale(.9)}
.ctl svg{width:24px;height:24px;fill:currentColor}
.ctl .big svg{width:36px;height:36px}
body.paused .ic-pause,body:not(.paused) .ic-play{display:none}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.barwrap{flex:1;padding:7px 0;cursor:pointer}
#track{height:4px;border-radius:2px;background:var(--faint);overflow:hidden}
#fill{height:100%;width:0;background:#fff}
.right{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.right input{width:110px;accent-color:#fff}
.right button{background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,.barwrap:focus-visible,#mini:focus-visible{outline:2px solid #fff;outline-offset:2px}
#np{position:fixed;inset:0 0 84px 0;z-index:20;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:6vw;align-items:center;padding:4vh 7vw;background:rgba(18,18,20,.82);backdrop-filter:blur(24px)}
#npArt{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:#333;box-shadow:0 30px 80px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s}
body.paused #npArt{transform:scale(.86)}
#lyrics{position:relative;height:calc(100vh - 84px - 8vh);overflow-y:auto;scrollbar-width:none;padding:34vh 0;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#lyrics p{font-size:clamp(24px,3vw,40px);font-weight:700;line-height:1.25;padding:10px 0;color:var(--faint);cursor:pointer;transition:color .4s,transform .4s,filter .4s;filter:blur(1.2px);transform-origin:left center}
#lyrics p.on{color:#fff;transform:scale(1.04);filter:none}
#lyrics p:hover{filter:none}
#lyrics p.none{cursor:default;font-size:20px;font-weight:500}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:rgba(0,0,0,.8);padding:10px 16px;border-radius:10px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadein{from{opacity:0}}
@keyframes dockin{from{opacity:0;transform:translateY(100%)}}
#app{animation:fadein .7s both}
#dock{animation:dockin .7s cubic-bezier(.2,.8,.2,1) .1s both}
#view{transition:opacity .2s}
#view.loading{opacity:.35;pointer-events:none}
#view>h1,#view>h2,#view>.head,#view>.msg,.card,.row{animation:rise .55s cubic-bezier(.2,.8,.2,1) var(--d,0ms) both}
#np{opacity:0;visibility:hidden;transform:translateY(24px) scale(.985);transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#np.open{opacity:1;visibility:visible;transform:none;transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
.card img{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.card:hover img{transform:scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.row{transition:background .2s}
#side a{transition:background .25s,color .25s}
.pill{transition:transform .15s,filter .2s}
.pill:hover{filter:brightness(1.12)}
.pill:active{transform:scale(.97)}
.pill.ghost{background:rgba(255,255,255,.14)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.ctl button{position:relative;transition:transform .12s,color .25s}
.ctl #shuf svg,.ctl #rep svg{width:20px;height:20px}
.ctl #shuf,.ctl #rep{color:var(--dim)}
.ctl .on{color:var(--red)!important}
#rep.one::after{content:"1";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:700}
.right{gap:2px}
.right .ib{background:none;padding:8px;border-radius:50%;color:var(--dim);display:grid;place-items:center;transition:color .2s,transform .12s}
.right .ib:hover{color:#fff}
.right .ib:active{transform:scale(.92)}
.right .ib.on{color:var(--red)}
.ib svg{width:20px;height:20px;fill:currentColor;display:block}
.tilt svg{transform:rotate(45deg)}
.right input[type=range]{-webkit-appearance:none;appearance:none;width:100px;height:4px;border-radius:2px;margin:0 6px;background:linear-gradient(to right,#fff var(--v,70%),rgba(255,255,255,.28) var(--v,70%));cursor:pointer}
.right input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s}
.right input[type=range]:hover::-webkit-slider-thumb{opacity:1}
.devwrap{position:relative}
#devs{position:absolute;right:0;bottom:52px;width:260px;padding:8px;border-radius:12px;background:rgba(44,44,48,.96);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s,transform .25s,visibility 0s .25s}
#devs.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s,visibility 0s}
#devs .dev{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
#devs .dev:hover{background:rgba(255,255,255,.1)}
#devs .dev small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#devs .dev.on{color:var(--red)}
#side .fh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;cursor:pointer;font-size:13px;font-weight:600;color:var(--dim);margin:18px 0 6px;padding:0 10px;text-align:left;transition:color .2s}
#side .fh:hover{color:#fff}
.fh svg{width:16px;height:16px;fill:currentColor;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.fh.closed svg{transform:rotate(-90deg)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.fold>div{overflow:hidden;min-height:0}
.fold.closed{grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s .35s}
h1,h2{letter-spacing:-.02em}
.row div b,.card b{font-weight:600}
.banner{display:flex;gap:24px;align-items:flex-end;margin:-30px -38px 0;padding:64px 38px 26px;background:linear-gradient(180deg,rgba(94,64,190,.75),rgba(94,64,190,0))}
.banner .cover{width:200px;height:200px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#450af5,#8e8ee5 70%,#c4efd9);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.banner .cover svg{width:80px;height:80px;fill:#fff}
.banner small{font-size:13px;font-weight:600}
.banner h1{font-size:clamp(40px,6vw,76px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0 14px}
.own{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px;flex-wrap:wrap}
.own img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.own b{color:#fff}
.acts2{display:flex;align-items:center;gap:20px;margin:6px 0 18px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--red);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,filter .2s}
.bigplay:hover{filter:brightness(1.1);transform:scale(1.05)}
.bigplay svg{width:28px;height:28px;fill:currentColor}
.acts2 .sh{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px;border-radius:50%;transition:color .2s}
.acts2 .sh:hover{color:#fff}
.acts2 .sh svg{width:30px;height:30px;fill:currentColor}
#view>.banner,#view>.acts2{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.banner.djb{background:linear-gradient(180deg,rgba(250,35,59,.5),rgba(250,35,59,0))}
.banner .cover.dj{background:linear-gradient(135deg,#fa233b,#ff9a62);font-size:64px;font-weight:800;letter-spacing:-.04em}
.chk{display:flex;gap:8px;align-items:center;color:var(--dim);cursor:pointer}
.chk input{accent-color:var(--red);width:16px;height:16px}
.mixcover{aspect-ratio:1;border-radius:8px;padding:14px;display:flex;align-items:flex-end;margin-bottom:8px;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.card:hover .mixcover{transform:scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.mt{font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.02em;text-align:left}
.djset{display:grid;gap:12px;max-width:520px;margin-bottom:20px;color:var(--dim)}
.djset label{display:grid;gap:6px}
.djset select,.djset input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:inherit;width:100%}
.djset option{color:#000}
#gset{display:grid;gap:10px}
@media(max-width:820px){#app{grid-template-columns:1fr}#side{display:none}#dock{grid-template-columns:1fr auto}.mid .prog,.right input{display:none}#np{grid-template-columns:1fr}#npArt{display:none}.head{flex-direction:column;align-items:flex-start}#view{padding:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<div id="gate">
  <p id="gateText"></p>
  <input id="cid" placeholder="Client ID из Spotify Dashboard" autocomplete="off" hidden>
  <button class="pill" id="saveCid" hidden>Сохранить</button>
  <button class="pill" id="loginBtn" hidden>Войти через Spotify</button>
</div>

<div id="app" hidden>
  <aside id="side">
    <input id="q" type="search" placeholder="Поиск" aria-label="Поиск">
    <a href="#home">Главная</a>
    <a href="#queue">Очередь</a>
    <a href="#dj">Мой DJ</a>
    <button class="fh" data-fold="lib" aria-expanded="true">Медиатека<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button><div class="fold" id="f-lib"><div>
    <a href="#tracks">Любимые треки</a>
    <a href="#albums">Альбомы</a>
    <a href="#artists">Артисты</a>
    <a href="#shows">Подкасты</a></div></div>
    <button class="fh" data-fold="pls" aria-expanded="true">Плейлисты<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button><div class="fold" id="f-pls"><div>
    <div id="pls"></div></div></div>
  </aside>
  <main id="view"></main>
</div>

<section id="np">
  <img id="npArt" alt="Обложка">
  <div id="lyrics" aria-label="Текст песни"></div>
</section>

<footer id="dock" hidden>
  <div id="mini" role="button" tabindex="0" aria-label="Открыть текст песни">
    <img id="bArt" alt=""><div><b id="bTitle">Ничего не играет</b><span id="bArtist">Включи что-нибудь из списка</span></div>
  </div>
  <div class="mid">
    <div class="ctl">
      <button id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button id="prev" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
      <button id="toggle" class="big" aria-label="Играть или пауза">
        <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
      <button id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
    <div class="prog"><span id="tNow">0:00</span><div class="barwrap" id="seek"><div id="track"><div id="fill"></div></div></div><span id="tEnd">0:00</span></div>
  </div>
  <div class="right"><button id="like" aria-label="Добавить в любимые" hidden>♡</button><button class="ib tilt" id="npBtn" aria-label="Текст песни" title="Текст песни"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg></button>
    <button class="ib" id="qBtn" aria-label="Очередь" title="Очередь"><svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg></button>
    <div class="devwrap"><button class="ib" id="devBtn" aria-label="Устройства" title="Устройства"><svg viewBox="0 0 24 24"><path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/></svg></button><div id="devs"></div></div>
    <button class="ib" id="muteBtn" aria-label="Без звука" title="Без звука"><svg viewBox="0 0 24 24"><path id="volPath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Громкость">
    <button class="ib" id="pipBtn" aria-label="Мини-плеер" title="Мини-плеер"><svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg></button>
    <button class="ib" id="fsBtn" aria-label="Во весь экран" title="Во весь экран"><svg viewBox="0 0 24 24"><path id="fsPath" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
  </div>
</footer>
<p id="toast" hidden></p>

<script>
/* ====== НАСТРОЙКИ ====== */
const CLIENT_ID = 'd92c4e464cf84953a09fbcb179e2d81d';
/* ======================== */
const LS = localStorage, $ = s => document.querySelector(s);
const REDIRECT = location.origin + location.pathname, SV = '4';

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function login() {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  LS.setItem('verifier', verifier);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: CID, scope: SCOPES, redirect_uri: REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CID, ...params})
  });
  if (!r.ok) throw new Error('auth');
  const d = await r.json();
  LS.setItem('access', d.access_token);
  if (d.refresh_token) LS.setItem('refresh', d.refresh_token);
  LS.setItem('exp', Date.now() + d.expires_in * 1000 - 60000);
}
async function getToken() {
  if (Date.now() < +LS.getItem('exp')) return LS.getItem('access');
  await tokenRequest({grant_type: 'refresh_token', refresh_token: LS.getItem('refresh')});
  return LS.getItem('access');
}
const dropTokens = () => ['access', 'refresh', 'exp', 'sv'].forEach(k => LS.removeItem(k));

async function get(p) {
  const r = await fetch(p.startsWith('http') ? p : 'https://api.spotify.com/v1' + p, {headers: {Authorization: 'Bearer ' + await getToken()}});
  if (!r.ok) throw new Error(r.status === 403 ? 'Spotify не отдаёт эти данные приложениям в Development Mode (403).' : 'Ошибка Spotify: ' + r.status);
  return r.json();
}
const g = p => get(p).catch(() => null);
async function api(method, path, body) {
  return fetch('https://api.spotify.com/v1' + path, {
    method, headers: {Authorization: 'Bearer ' + await getToken(), 'Content-Type': 'application/json'},
    body: body && JSON.stringify(body)

}

const GV = ['Kore', 'Aoede', 'Leda', 'Zephyr', 'Puck', 'Charon', 'Fenrir', 'Orus', 'Sulafat', 'Achernar'];
const gKey = () => LS.getItem('gkey') || '', gVoice = () => LS.getItem('gvoice') || 'Kore';
const gModel = () => LS.getItem('gmodel') || 'gemini-3.1-flash-tts-preview';

const INTRO = 'Привет! Я твой DJ. Сегодня микс целиком из твоей музыки. Начинаем.';
let actx = null, gWarned = false;
const audioCache = new Map();

function geminiAudio(text) {
  const k = gModel() + '|' + gVoice() + '|' + text;
  if (!audioCache.has(k)) audioCache.set(k, (async () => {
    actx ||= new AudioContext({sampleRate: 24000});
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + gModel() + ':generateContent', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': gKey()},
      body: JSON.stringify({
        contents: [{parts: [{text: 'Скажи по-русски тёплым, бодрым голосом радио-диджея: ' + text}]}],
        generationConfig: {responseModalities: ['AUDIO'], speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: gVoice()}}}}
      })
    });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const bin = atob(d.candidates[0].content.parts[0].inlineData.data), n = bin.length >> 1, f = new Float32Array(n);
    for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; f[i] = v / 32768; }
    const buf = actx.createBuffer(1, n, 24000); buf.copyToChannel(f, 0);
    return buf;
  })().catch(e => { audioCache.delete(k); throw e; }));
  return audioCache.get(k);
}
async function sayGemini(text) {
  const buf = await geminiAudio(text);
  await actx.resume();
  try { dj.src?.stop(); } catch (e) {}
  const src = actx.createBufferSource();
  src.buffer = buf; src.connect(actx.destination);
  player?.setVolume(+$('#vol').value * 0.25);
  src.onended = () => player?.setVolume(+$('#vol').value);
  dj.src = src; src.start();
}

    const picked = mix.slice(0, 100);

function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
const shuffled = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => { const m = new Map(); a.forEach(t => { if (t?.uri?.startsWith('spotify:track:') && !m.has(t.uri)) m.set(t.uri, t); }); return [...m.values()]; };
let likedCache = null;
async function likedAll() {
  if (likedCache) return likedCache;
  const out = []; let url = '/me/tracks?limit=50';
  while (url) { const d = await get(url); d.items.forEach(x => x.track && out.push(x.track)); url = d.next; }
  return likedCache = out;
}
const grad = h => `linear-gradient(135deg,hsl(${h} 75% 52%),hsl(${(h + 45) % 360} 70% 32%))`;
async function buildMixes() {
  const key = 'mixes_' + new Date().toLocaleDateString('sv');
  const c = LS.getItem(key);
  if (c) return JSON.parse(c);
  Object.keys(LS).filter(k => k.startsWith('mixes_')).forEach(k => LS.removeItem(k));
  const rng = seeded(key);
  const [t1, t2, t3, rec, ta, liked] = await Promise.all([
    g('/me/top/tracks?limit=50&time_range=short_term'), g('/me/top/tracks?limit=50&time_range=medium_term'),
    g('/me/top/tracks?limit=50&time_range=long_term'), g('/me/player/recently-played?limit=50'),
    g('/me/top/artists?limit=3&time_range=medium_term'), likedAll().catch(() => [])]);
  const recent = uniq((rec?.items || []).map(x => x.track));
  const defs = [
    ['day', 'Микс дня', uniq([...(t1?.items || []), ...(t2?.items || []), ...recent, ...shuffled(liked, rng).slice(0, 40)]), 350, true],
    ['month', 'Топ месяца', uniq(t1?.items || []), 210],
    ['half', 'Топ полугода', uniq(t2?.items || []), 270],
    ['all', 'Топ за всё время', uniq(t3?.items || []), 30],
    ['recent', 'Недавнее', recent, 160],
    ['old', 'Забытые любимые', liked.length > 40 ? shuffled(liked.slice(-150), rng).slice(0, 40) : [], 300]
  ];
  (ta?.items || []).forEach((a, i) => defs.push(['art' + i, 'Любимое: ' + a.name, shuffled(liked.filter(t => t.artists.some(x => x.id === a.id)), rng).slice(0, 40), [190, 50, 120][i]]));
  const mini = t => ({uri: t.uri, name: t.name, duration_ms: t.duration_ms, artists: t.artists.map(a => ({id: a.id, name: a.name})), album: {images: [{url: t.album?.images?.slice(-1)[0]?.url || ''}]}});
  const mixes = defs.map(([id, title, ts, hue, mixIt]) => {
    ts = (mixIt ? shuffled(ts, rng) : ts).slice(0, 50);
    const names = [...new Set(ts.map(t => t.artists[0].name))].slice(0, 3);
    return {id, title, hue, sub: names.join(', ') + (names.length ? ' и другие' : ''), tracks: ts.map(mini)};
  }).filter(m => m.tracks.length >= 5);
  try { LS.setItem(key, JSON.stringify(mixes)); } catch (e) {}
  return mixes;
}

async function loadLyrics(t, dur) {

      const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);

  syncPip();
};
$('#seek').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); player?.seek(Math.round((e.clientX - r.left) / r.width * st.dur)); };

/* ---------- сворачиваемые разделы сайдбара ---------- */
const folds = JSON.parse(LS.getItem('folds') || '{}');
document.querySelectorAll('.fh').forEach(b => {
  const id = b.dataset.fold, box = $('#f-' + id);
  const apply = () => { const c = !!folds[id]; box.classList.toggle('closed', c); b.classList.toggle('closed', c); b.setAttribute('aria-expanded', !c); };
  apply();
  b.onclick = () => { folds[id] = !folds[id]; LS.setItem('folds', JSON.stringify(folds)); apply(); };
});

/* ---------- старт ---------- */
$('#loginBtn').onclick = login;
$('#saveCid').onclick = () => { const v = $('#cid').value.trim(); if (v) { LS.setItem('cid', v); CID = v; init(); } };
window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; if (authed) startPlayer(); };

async function init() {
  try {
    if (!CID) return gate('Вставь Client ID своего приложения из Spotify Dashboard (вкладка Basic Information). Это нужно один раз.', 'cid');
    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      await tokenRequest({grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.getItem('verifier')});
      LS.setItem('sv', SV);
      history.replaceState({}, '', REDIRECT);
    } else if (LS.getItem('sv') !== SV) dropTokens();
    if (!LS.getItem('refresh')) return gate('Войди в аккаунт Spotify Premium. Приложению нужны новые разрешения для медиатеки и истории.', 'login');
    authed = true;
    $('#gate').hidden = true; $('#app').hidden = false; $('#dock').hidden = false;
    document.body.classList.add('paused');
    route();
    if (sdkReady) startPlayer();
    g('/me/playlists?limit=50').then(d => { if (d) $('#pls').innerHTML = d.items.filter(Boolean).map(p => `<a href="#playlist/${esc(p.id)}">${esc(p.name)}</a>`).join(''); });
  } catch (e) {
    dropTokens();
    gate('Не получилось войти. Проверь Client ID и попробуй ещё раз.', 'login');
  }
}
init();
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
