<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Музыка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fg:#fff;--dim:rgba(255,255,255,.6);--faint:rgba(255,255,255,.28);--red:#fa233b;--line:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;color:var(--fg);background:#1c1c1e;overflow:hidden;font-size:14px}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
#bg{transition:opacity .5s;position:fixed;inset:-120px;background:#2a2a2e center/cover;filter:blur(80px) saturate(1.6);transform:scale(1.15)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.62)}
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:17px;line-height:1.5;color:var(--dim);background:#1c1c1e}
.pill{background:var(--red);color:#fff;border:0;border-radius:999px;padding:11px 26px;font-weight:600;cursor:pointer}
#cid{width:min(420px,90vw);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
#app{position:relative;display:grid;grid-template-columns:240px 1fr;height:calc(100% - 84px)}
#side{padding:18px 12px;overflow:auto;background:rgba(28,28,30,.5);backdrop-filter:blur(30px);border-right:1px solid var(--line)}
#q{width:100%;padding:9px 12px;border-radius:9px;border:0;background:rgba(255,255,255,.1);margin-bottom:14px}
#side a{display:block;padding:8px 10px;border-radius:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side a:hover{background:rgba(255,255,255,.07)}
#side a.on{background:rgba(255,255,255,.12);color:var(--red)}
#side h3{font-size:13px;color:var(--dim);font-weight:600;margin:18px 10px 6px}
#view{overflow:auto;padding:30px 38px 50px}
h1{font-size:30px;font-weight:700;margin-bottom:18px}
h2{font-size:21px;font-weight:700;margin:30px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 18px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333;box-shadow:0 8px 20px rgba(0,0,0,.35);margin-bottom:8px;display:block}
.card.round img{border-radius:50%}
.card.round{text-align:center}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--dim);font-size:13px}
.row{display:grid;grid-template-columns:44px 1fr auto 28px;gap:12px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.row:hover,.row:focus-visible{background:rgba(255,255,255,.09);outline:0}
.row .n{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row img{width:44px;height:44px;border-radius:5px;display:block;object-fit:cover;background:#333}
.row div{min-width:0}
.row div b,.row div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row div span{color:var(--dim);font-size:13px}
.row time{color:var(--dim);font-variant-numeric:tabular-nums}
.row .q{opacity:0;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--dim);border-radius:6px}
.row:hover .q,.row:focus-within .q{opacity:1}
.row .q:hover{color:#fff;background:rgba(255,255,255,.12)}
.right #like{font-size:22px;line-height:1;padding:4px 8px;background:none}
.right #like.on{color:var(--red)}
.head{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
.head img{width:230px;height:230px;border-radius:12px;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#333}
.head.round img{border-radius:50%}
.head h1{margin:0 0 6px;font-size:34px}
.head p{color:var(--dim);margin-bottom:16px}
.msg{color:var(--dim);line-height:1.5}
#dock{position:fixed;left:0;right:0;bottom:0;height:84px;z-index:30;display:grid;grid-template-columns:1fr minmax(300px,520px) 1fr;gap:16px;align-items:center;padding:0 20px;background:rgba(28,28,30,.72);backdrop-filter:blur(30px);border-top:1px solid var(--line)}
#mini{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
#bArt{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#333;flex:none;transition:opacity .35s}
#mini div{min-width:0}
#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini span{color:var(--dim);font-size:13px}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px}
.ctl button{background:none;border:0;cursor:pointer;padding:4px;border-radius:50%;display:grid;place-items:center}
.ctl button:active{transform:scale(.9)}
.ctl svg{width:24px;height:24px;fill:currentColor}
.ctl .big svg{width:36px;height:36px}
body.paused .ic-pause,body:not(.paused) .ic-play{display:none}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.barwrap{flex:1;padding:7px 0;cursor:pointer}
#track{height:4px;border-radius:2px;background:var(--faint);overflow:hidden}
#fill{height:100%;width:0;background:#fff}
.right{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.right input{width:110px;accent-color:#fff}
.right button{background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,.barwrap:focus-visible,#mini:focus-visible{outline:2px solid #fff;outline-offset:2px}
#np{position:fixed;inset:0 0 84px 0;z-index:20;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:6vw;align-items:center;padding:4vh 7vw;background:rgba(18,18,20,.82);backdrop-filter:blur(24px)}
#npArt{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:#333;box-shadow:0 30px 80px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s}
body.paused #npArt{transform:scale(.86)}
#lyrics{position:relative;height:calc(100vh - 84px - 8vh);overflow-y:auto;scrollbar-width:none;padding:34vh 0;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#lyrics p{font-size:clamp(24px,3vw,40px);font-weight:700;line-height:1.25;padding:10px 0;color:var(--faint);cursor:pointer;transition:color .4s,transform .4s,filter .4s;filter:blur(1.2px);transform-origin:left center}
#lyrics p.on{color:#fff;transform:scale(1.04);filter:none}
#lyrics p:hover{filter:none}
#lyrics p.none{cursor:default;font-size:20px;font-weight:500}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:rgba(0,0,0,.8);padding:10px 16px;border-radius:10px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadein{from{opacity:0}}
@keyframes dockin{from{opacity:0;transform:translateY(100%)}}
#app{animation:fadein .7s both}
#dock{animation:dockin .7s cubic-bezier(.2,.8,.2,1) .1s both}
#view{transition:opacity .2s}
#view.loading{opacity:.35;pointer-events:none}
#view>h1,#view>h2,#view>.head,#view>.msg,.card,.row{animation:rise .55s cubic-bezier(.2,.8,.2,1) var(--d,0ms) both}
#np{opacity:0;visibility:hidden;transform:translateY(24px) scale(.985);transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#np.open{opacity:1;visibility:visible;transform:none;transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
.card img{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.card:hover img{transform:scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.row{transition:background .2s}
#side a{transition:background .25s,color .25s}
.pill{transition:transform .15s,filter .2s}
.pill:hover{filter:brightness(1.12)}
.pill:active{transform:scale(.97)}
.pill.ghost{background:rgba(255,255,255,.14)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.ctl button{position:relative;transition:transform .12s,color .25s}
.ctl #shuf svg,.ctl #rep svg{width:20px;height:20px}
.ctl #shuf,.ctl #rep{color:var(--dim)}
.ctl .on{color:var(--red)!important}
#rep.one::after{content:"1";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:700}
.right{gap:2px}
.right .ib{background:none;padding:8px;border-radius:50%;color:var(--dim);display:grid;place-items:center;transition:color .2s,transform .12s}
.right .ib:hover{color:#fff}
.right .ib:active{transform:scale(.92)}
.right .ib.on{color:var(--red)}
.ib svg{width:20px;height:20px;fill:currentColor;display:block}
.tilt svg{transform:rotate(45deg)}
.right input[type=range]{-webkit-appearance:none;appearance:none;width:100px;height:4px;border-radius:2px;margin:0 6px;background:linear-gradient(to right,#fff var(--v,70%),rgba(255,255,255,.28) var(--v,70%));cursor:pointer}
.right input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s}
.right input[type=range]:hover::-webkit-slider-thumb{opacity:1}
.devwrap{position:relative}
#devs{position:absolute;right:0;bottom:52px;width:260px;padding:8px;border-radius:12px;background:rgba(44,44,48,.96);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s,transform .25s,visibility 0s .25s}
#devs.open{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s,visibility 0s}
#devs .dev{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
#devs .dev:hover{background:rgba(255,255,255,.1)}
#devs .dev small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
#devs .dev.on{color:var(--red)}
#side .fh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;cursor:pointer;font-size:13px;font-weight:600;color:var(--dim);margin:18px 0 6px;padding:0 10px;text-align:left;transition:color .2s}
#side .fh:hover{color:#fff}
.fh svg{width:16px;height:16px;fill:currentColor;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.fh.closed svg{transform:rotate(-90deg)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.fold>div{overflow:hidden;min-height:0}
.fold.closed{grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s .35s}
h1,h2{letter-spacing:-.02em}
.row div b,.card b{font-weight:600}
.banner{display:flex;gap:24px;align-items:flex-end;margin:-30px -38px 0;padding:64px 38px 26px;background:linear-gradient(180deg,rgba(94,64,190,.75),rgba(94,64,190,0))}
.banner .cover{width:200px;height:200px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#450af5,#8e8ee5 70%,#c4efd9);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.banner .cover svg{width:80px;height:80px;fill:#fff}
.banner small{font-size:13px;font-weight:600}
.banner h1{font-size:clamp(40px,6vw,76px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0 14px}
.own{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:14px;flex-wrap:wrap}
.own img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.own b{color:#fff}
.acts2{display:flex;align-items:center;gap:20px;margin:6px 0 18px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--red);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,filter .2s}
.bigplay:hover{filter:brightness(1.1);transform:scale(1.05)}
.bigplay svg{width:28px;height:28px;fill:currentColor}
.acts2 .sh{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px;border-radius:50%;transition:color .2s}
.acts2 .sh:hover{color:#fff}
.acts2 .sh svg{width:30px;height:30px;fill:currentColor}
#view>.banner,#view>.acts2{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.banner.djb{background:linear-gradient(180deg,rgba(250,35,59,.5),rgba(250,35,59,0))}
.banner .cover.dj{background:linear-gradient(135deg,#fa233b,#ff9a62);font-size:64px;font-weight:800;letter-spacing:-.04em}
.chk{display:flex;gap:8px;align-items:center;color:var(--dim);cursor:pointer}
.chk input{accent-color:var(--red);width:16px;height:16px}
.mixcover{aspect-ratio:1;border-radius:8px;padding:14px;display:flex;align-items:flex-end;margin-bottom:8px;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.card:hover .mixcover{transform:scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.mt{font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.02em;text-align:left}
.djset{display:grid;gap:12px;max-width:520px;margin-bottom:20px;color:var(--dim)}
.djset label{display:grid;gap:6px}
.djset select,.djset input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:inherit;width:100%}
.djset option{color:#000}
#gset{display:grid;gap:10px}
#tabs,#npClose,#npInfo,.mq{display:none}
#npClose{background:none;border:0;color:#fff;cursor:pointer;padding:4px}
#npClose svg{width:32px;height:32px;fill:currentColor}
#npInfo b,#npInfo span{display:block}
#npInfo span{color:var(--dim);margin-top:2px}
.lnk{display:block;padding:14px 4px;font-size:17px;font-weight:600;border-bottom:1px solid var(--line)}
@media(max-width:820px){
body{height:100dvh}
#app{grid-template-columns:1fr;height:100%}
#side{display:none}
#view{padding:20px 16px calc(150px + env(safe-area-inset-bottom))}
.banner{margin:-20px -16px 0;padding:36px 16px 20px;flex-direction:column;align-items:flex-start;gap:16px}
.banner .cover,.head img{width:min(60vw,220px);height:min(60vw,220px)}
.head{flex-direction:column;align-items:flex-start;gap:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 12px}
.row .q{opacity:1}
.mq{display:block;width:100%;padding:12px 14px;border-radius:12px;border:0;background:rgba(255,255,255,.1);margin-bottom:16px;font-size:16px;color:#fff;font-family:inherit}
#toast{bottom:calc(140px + env(safe-area-inset-bottom));width:max-content;max-width:90vw}
#tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(28,28,30,.85);backdrop-filter:blur(30px);border-top:1px solid var(--line);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
#tabs a{flex:1;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--dim);transition:color .2s}
#tabs a.on{color:var(--red)}
#tabs svg{width:24px;height:24px;fill:currentColor}
body.npopen #tabs{transform:translateY(100%)}
#dock{left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));height:64px;grid-template-columns:1fr auto;gap:8px;padding:0 10px;border-radius:14px;border:1px solid var(--line);transition:bottom .4s cubic-bezier(.2,.8,.2,1)}
#dock #shuf,#dock #prev,#dock #rep,#dock .prog,#dock .right{display:none}
#dock .ctl{gap:6px}
body.npopen #dock{left:0;right:0;bottom:0;height:auto;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px 20px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;border-width:1px 0 0}
body.npopen #mini{display:none}
body.npopen #dock #shuf,body.npopen #dock #prev,body.npopen #dock #rep{display:grid}
body.npopen #dock .prog{display:flex}
body.npopen #dock .right{display:flex;justify-content:space-around}
body.npopen #dock .right input,body.npopen #pipBtn,body.npopen #fsBtn,body.npopen #npBtn{display:none}
body.npopen #dock .ctl{gap:20px}
#np{inset:0;padding:calc(12px + env(safe-area-inset-top)) 20px 230px;grid-template-columns:1fr;grid-template-rows:auto auto auto minmax(0,1fr);gap:12px;align-content:start;align-items:start;justify-items:center;background:rgba(18,18,20,.94)}
#npClose{display:grid;justify-self:start}
#npArt{width:min(66vw,280px)}
#npInfo{display:block;text-align:center;width:100%}
#npInfo b{font-size:19px}
#lyrics{width:100%;height:100%;padding:15vh 0}
#lyrics p{font-size:24px}
#devs{width:min(240px,70vw)}
}
.vibe{display:flex;gap:10px;max-width:680px;margin-bottom:12px}
.vibe input{flex:1;min-width:0;padding:14px 18px;border-radius:999px;border:0;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.3);color:#fff;font:inherit;font-size:15px}
.vibe input::placeholder{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-width:680px;margin-bottom:16px}
.chip{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.06));border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s}
.chip:hover{background:rgba(255,255,255,.2)}
.chip:active{transform:scale(.94)}
#vibeOut{white-space:pre-line;max-width:680px;margin-bottom:16px}
.gap{padding:6px!important}
#lyrics.plain p{color:rgba(255,255,255,.88);filter:none;cursor:default;transform:none;font-size:clamp(18px,2vw,24px);font-weight:600}
#lyrics p.src,#lyrics.plain p.src{font-size:12px;font-weight:500;color:var(--dim);filter:none;cursor:default;padding:28px 0 0;transform:none}
#lyrics p.src a{text-decoration:underline}
.devlist .dev{display:block;width:100%;text-align:left;background:rgba(255,255,255,.1);border:0;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
.devlist .dev.on{outline:2px solid var(--red)}
.devlist .dev small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.diag{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);background:rgba(255,255,255,.07);border-radius:12px;padding:12px;margin-top:10px;display:none}
.diag:not(:empty){display:block}
@property --c1{syntax:'<color>';inherits:true;initial-value:#6b3fa0}
@property --c2{syntax:'<color>';inherits:true;initial-value:#2a6fdb}
@property --c3{syntax:'<color>';inherits:true;initial-value:#d6336c}
@property --c4{syntax:'<color>';inherits:true;initial-value:#f08c00}
#npbg{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none;transition:--c1 1.6s,--c2 1.6s,--c3 1.6s,--c4 1.6s}
#npbg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75;mix-blend-mode:screen;will-change:transform}
#npbg i:nth-child(1){background:radial-gradient(circle,var(--c1),transparent 62%);left:-20vmax;top:-20vmax;animation:blobA 22s ease-in-out infinite alternate}
#npbg i:nth-child(2){background:radial-gradient(circle,var(--c2),transparent 62%);right:-25vmax;top:-15vmax;animation:blobB 27s ease-in-out infinite alternate}
#npbg i:nth-child(3){background:radial-gradient(circle,var(--c3),transparent 62%);left:-15vmax;bottom:-30vmax;animation:blobC 31s ease-in-out infinite alternate}
#npbg i:nth-child(4){background:radial-gradient(circle,var(--c4),transparent 62%);right:-20vmax;bottom:-25vmax;animation:blobD 36s ease-in-out infinite alternate}
@keyframes blobA{to{transform:translate(38vmax,26vmax) scale(1.3) rotate(40deg)}}
@keyframes blobB{to{transform:translate(-34vmax,30vmax) scale(.85) rotate(-35deg)}}
@keyframes blobC{to{transform:translate(40vmax,-28vmax) scale(1.2) rotate(30deg)}}
@keyframes blobD{to{transform:translate(-36vmax,-24vmax) scale(.9) rotate(-45deg)}}
#np:not(.open) #npbg i{animation-play-state:paused}

<script>
/* ====== НАСТРОЙКИ ====== */
const CLIENT_ID = 'd92c4e464cf84953a09fbcb179e2d81d';
/* ======================== */
const LS = localStorage, $ = s => document.querySelector(s);
const BUILD = '2026-10-23-b';
const REMOTE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const REDIRECT = location.origin + location.pathname, SV = '4';
const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-recently-played user-top-read user-library-read user-library-modify user-follow-read playlist-read-private playlist-read-collaborative';
let CID = CLIENT_ID.startsWith('ВСТАВЬ') ? LS.getItem('cid') : CLIENT_ID, player, devId, sdkReady = false, authed = false;
let shownId = null, lines = [], cur = -1, snap = false;
let curCtx = null, curTracks = [], more = null, rid = 0, after = null, me = null;
let st = {pos: 0, at: 0, paused: true, dur: 1}, shuf = false, rep = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const pic = (o, i = 1) => { const a = o?.images || o?.album?.images || []; return a[Math.min(i, a.length - 1)]?.url || ''; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => t.hidden = true, 8000); }
function gate(text, mode) {
  $('#gateText').textContent = text;
  $('#cid').hidden = $('#saveCid').hidden = mode !== 'cid';
  $('#loginBtn').hidden = mode !== 'login';
  $('#gate').hidden = false;
}

/* ---------- авторизация (PKCE) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function login() {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  LS.setItem('verifier', verifier);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: CID, scope: SCOPES, redirect_uri: REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CID, ...params})
  });
  if (!r.ok) throw new Error('auth');
  const d = await r.json();
  LS.setItem('access', d.access_token);
  if (d.refresh_token) LS.setItem('refresh', d.refresh_token);
  LS.setItem('exp', Date.now() + d.expires_in * 1000 - 60000);
}
async function getToken() {
  if (Date.now() < +LS.getItem('exp')) return LS.getItem('access');
  await tokenRequest({grant_type: 'refresh_token', refresh_token: LS.getItem('refresh')});
  return LS.getItem('access');
}
const dropTokens = () => ['access', 'refresh', 'exp', 'sv'].forEach(k => LS.removeItem(k));

async function get(p) {
  const r = await fetch(p.startsWith('http') ? p : 'https://api.spotify.com/v1' + p, {headers: {Authorization: 'Bearer ' + await getToken()}});
  if (!r.ok) throw new Error(r.status === 403 ? 'Spotify не отдаёт эти данные приложениям в Development Mode (403).' : 'Ошибка Spotify: ' + r.status);
  return r.json();
}
const g = p => get(p).catch(() => null);
async function api(method, path, body) {
  return fetch('https://api.spotify.com/v1' + path, {
    method, headers: {Authorization: 'Bearer ' + await getToken(), 'Content-Type': 'application/json'},
    body: body && JSON.stringify(body)
  });
}
const whyFail = async r => { try { const j = await r.clone().json(); return j.error?.reason || j.error?.message || ''; } catch (e) { return ''; } };
const putPlay = (body, dev) => api('PUT', '/me/player/play' + (dev ? '?device_id=' + dev : ''), body);
function wakeHint() {
  $('#bArtist').innerHTML = 'Открой Spotify и включи любой трек · <a href="https://open.spotify.com/" target="_blank" rel="noopener" style="text-decoration:underline">Открыть Spotify</a>';
}
async function play(body) {
  if (!REMOTE && !devId) return toast('Плеер ещё подключается, подожди секунду');
  // на телефоне сначала пробуем активное устройство без device_id
  let r = await putPlay(body, REMOTE ? (LS.getItem('rdev') || null) : devId);
  if (!r.ok && REMOTE) {
    const d = await g('/me/player/devices');
    const dv = d?.devices?.find(x => x.is_active) || d?.devices?.find(x => /smartphone|tablet/i.test(x.type)) || d?.devices?.[0];
    if (dv) {
      devId = dv.id;
      await api('PUT', '/me/player', {device_ids: [dv.id], play: false});
      await new Promise(res => setTimeout(res, 600));
      r = await putPlay(body, dv.id);
    }
  }
  if (!r.ok && body.context_uri?.endsWith(':collection')) {
    const i = Math.max(0, curTracks.indexOf(body.offset?.uri));
    r = await putPlay({uris: curTracks.slice(i, i + 100)}, devId);
  }
  if (r.ok) { if (REMOTE) setTimeout(async () => { await pollRemote(); toast(lastDev ? 'Играет на: ' + lastDev.name : 'Команда отправлена, но Spotify не показывает активное устройство'); }, 1400); return; }
  const why = await whyFail(r);
  if (r.status === 404) { toast('Нет активного устройства: открой Spotify на телефоне, включи любой трек (хоть на секунду) и вернись сюда'); if (REMOTE) wakeHint(); }
  else if (why === 'PREMIUM_REQUIRED') toast('Для управления воспроизведением нужен Spotify Premium');
  else if (r.status === 429) toast('Слишком много запросов, подожди минуту');
  else toast('Не удалось включить (' + r.status + (why ? ': ' + why : '') + ')');
}

/* ---------- элементы интерфейса ---------- */
const card = (go, o, sub, round) => `<a class="card${round ? ' round' : ''}" href="#${go}"><img loading="lazy" src="${esc(pic(o, 1))}" alt=""><b>${esc(o.name)}</b><span>${esc(sub)}</span></a>`;

/* ---------- Мой DJ: микс из твоей музыки + голосовые вставки ---------- */
const dj = {on: false, info: {}, order: [], plan: {}, voice: true, engine: LS.getItem('dengine') || 'browser'};
const clean = n => n.replace(/\s*[\(\[].*?[\)\]]/g, '').replace(/\s-\s.*$/, '').trim();
const pick = a => a[Math.floor(Math.random() * a.length)];
function browserSay(text) {
  if (!dj.voice || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('ru'));
  if (v) u.voice = v;
  u.lang = 'ru-RU'; u.rate = 1.02;
  u.onstart = () => player?.setVolume(+$('#vol').value * 0.25);
  u.onend = u.onerror = () => player?.setVolume(+$('#vol').value);

/* --- голос Gemini (по API-ключу, который хранится только в этом браузере) --- */
const GV = ['Kore', 'Aoede', 'Leda', 'Zephyr', 'Puck', 'Charon', 'Fenrir', 'Orus', 'Sulafat', 'Achernar'];
const gKey = () => LS.getItem('gkey') || '', gVoice = () => LS.getItem('gvoice') || 'Kore';
const gModel = () => LS.getItem('gmodel') || 'gemini-3.1-flash-tts-preview';
const useGemini = () => dj.engine === 'gemini' && !!gKey();
const INTRO = 'Привет! Я твой DJ. Сегодня микс целиком из твоей музыки. Начинаем.';
let actx = null, gWarned = false;
const audioCache = new Map();
const gErr = e => ({'404': 'Gemini: такой модели нет, проверь название в поле «Модель»', '400': 'Gemini: запрос отклонён, проверь модель и ключ', '401': 'Gemini: ключ не подошёл', '403': 'Gemini: ключ не подошёл или нет доступа', '429': 'Gemini: превышен лимит запросов'})[e.message] || 'Gemini: не получилось (' + e.message + ')';
function geminiAudio(text) {
  const k = gModel() + '|' + gVoice() + '|' + text;
  if (!audioCache.has(k)) audioCache.set(k, (async () => {
    actx ||= new AudioContext({sampleRate: 24000});
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + gModel() + ':generateContent', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': gKey()},
      body: JSON.stringify({
        contents: [{parts: [{text: 'Скажи по-русски тёплым, бодрым голосом радио-диджея: ' + text}]}],
        generationConfig: {responseModalities: ['AUDIO'], speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: gVoice()}}}}
      })
    });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const bin = atob(d.candidates[0].content.parts[0].inlineData.data), n = bin.length >> 1, f = new Float32Array(n);
    for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; f[i] = v / 32768; }
    const buf = actx.createBuffer(1, n, 24000); buf.copyToChannel(f, 0);
    return buf;
  })().catch(e => { audioCache.delete(k); throw e; }));
  return audioCache.get(k);
}
async function sayGemini(text) {
  const buf = await geminiAudio(text);
  await actx.resume();
  try { dj.src?.stop(); } catch (e) {}
  const src = actx.createBufferSource();
  src.buffer = buf; src.connect(actx.destination);
  player?.setVolume(+$('#vol').value * 0.25);
  src.onended = () => player?.setVolume(+$('#vol').value);
  dj.src = src; src.start();
}
function say(text) {
  if (!dj.voice) return;
  if (useGemini()) return sayGemini(text).catch(e => { if (!gWarned) { gWarned = true; toast(gErr(e) + '. Пока говорю обычным голосом.'); } browserSay(text); });
  browserSay(text);
}
async function testVoice() {

const LINES = {
  top: ['{a}. Один из треков, которые ты гоняешь чаще всего.', 'Из твоего топа: {t}, {a}.', '{a} и {t}. Ты слушаешь это снова и снова.'],
  recent: ['Вернёмся к тому, что ты слушал недавно: {a}.', '{t}. Кажется, ты уже включал это на днях.', 'Недавнее от {a}.'],
  liked: ['Из твоих любимых: {a}, {t}.', 'Давно не слушал? {t} из твоих лайков.', 'Достаю из медиатеки: {a}.']
};
LINES.new = ['Кое-что новенькое для тебя: {a}.', 'А это {a}. Ты мог это пропустить.', '{t}. Думаю, тебе зайдёт.'];
function planFor(uri) {
  if (!(uri in dj.plan)) { const i = dj.info[uri]; dj.plan[uri] = i && Math.random() < 0.65 ? pick(LINES[i.why]).replace('{a}', i.a).replace('{t}', clean(i.t)) : null; }

}
function djSpeak(t) {
  if (!dj.on || !dj.info[t.uri]) return;
  if (dj.first) { dj.first = false; say(dj.intro || INTRO); }
  else { const x = planFor(t.uri); if (x) say(x); }
  const nx = dj.order[dj.order.indexOf(t.uri) + 1], nt = nx && planFor(nx);
  if (nt && useGemini()) geminiAudio(nt).catch(() => {});
}
const setDjBtn = (txt, dis) => { const b = $('#djStart'); if (b) { b.textContent = txt; b.disabled = !!dis; } };
function stopDj() {

async function launchMix(picked, intro) {

  if (useGemini()) geminiAudio(dj.intro).catch(() => {});
  shuf = false; setModes();
  await api('PUT', '/me/player/shuffle?state=false' + dq());
  dj.on = true;
  await play({uris: picked.map(x => x[0])});
  setDjBtn('Выключить DJ');
}

/* ---------- запрос вайба своими словами ---------- */
const gText = () => LS.getItem('gtext') || 'gemini-flash-latest';
async function geminiJson(prompt) {
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + gText() + ':generateContent', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-goog-api-key': gKey()},
    body: JSON.stringify({contents: [{parts: [{text: prompt}]}], generationConfig: {responseMimeType: 'application/json', temperature: 0.9}})
  });
  if (!r.ok) throw new Error(r.status);
  const d = await r.json();
  const txt = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  return JSON.parse(txt.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, '').trim());
}
async function vibe(text, status) {
  if (!gKey()) {
    status('Ключа Gemini нет, поэтому просто ищу по тексту…');
    const d = await get('/search?' + new URLSearchParams({q: text, type: 'track', limit: 10}));
    const tr = (d.tracks?.items || []).filter(Boolean);
    if (!tr.length) throw new Error('Ничего не нашлось по такому запросу');
    await launchMix(tr.map(t => [t.uri, {why: 'new', a: t.artists[0].name, t: t.name}]), null);
    status('Нашёл ' + tr.length + ' треков по запросу. Чтобы DJ понимал вайбы («спокойное», «для работы»), добавь ключ Gemini ниже.');
    return;
  }
  status('Смотрю твою медиатеку…');
  const liked = await likedAll().catch(() => []);
  const likedSet = new Set(liked.map(t => t.uri));
  const sample = shuffled(liked, Math.random).slice(0, 250);
  const list = sample.map((t, i) => i + '|' + t.artists[0].name + ' - ' + clean(t.name)).join('\n');
  status('DJ думает…');
  const j = await geminiJson(`Ты DJ в музыкальном плеере. Пользователь просит: "${text}".
Ниже пронумерованный список треков из его медиатеки (номер|исполнитель - название).
Верни ТОЛЬКО JSON такого вида:
{"say": "1-2 коротких дружелюбных предложения по-русски: что ты включаешь и почему, без номеров", "pick": [номера подходящих треков из списка, до 40 штук, можно пустой массив], "artists": ["исполнители, чьи треки стоит добавить через поиск, названия на оригинальном языке (зарубежных латиницей)"]}
Если пользователь назвал конкретного исполнителя: в pick только его треки из списка, в artists только он сам.
Если просит настроение или жанр: в pick самые подходящие треки из списка, в artists до 6 подходящих исполнителей (можно тех, кого нет в списке, чтобы он услышал новое).
Список:
${list}`);
  const entries = new Map();
  [...new Set((j.pick || []).map(Number))].forEach(i => { const t = sample[i]; if (t) entries.set(t.uri, {why: 'liked', a: t.artists[0].name, t: t.name}); });
  const libCount = entries.size;
  const artists = (j.artists || []).map(String).slice(0, 6);
  for (const name of artists) {
    status('Ищу: ' + name + '…');
    for (const off of artists.length === 1 ? [0, 10, 20] : [0]) {
      const d = await g('/search?' + new URLSearchParams({q: 'artist:"' + name + '"', type: 'track', limit: 10, offset: off}));
      (d?.tracks?.items || []).forEach(t => {
        const n = name.toLowerCase();
        if (t?.uri && !entries.has(t.uri) && t.artists.some(a => { const x = a.name.toLowerCase(); return x.includes(n) || n.includes(x); }))
          entries.set(t.uri, {why: likedSet.has(t.uri) ? 'liked' : 'new', a: t.artists[0].name, t: t.name});
      });
    }
  }
  const mix = shuffled([...entries.entries()], Math.random).slice(0, 100);
  if (!mix.length) throw new Error('Не нашёл подходящих треков, попробуй сформулировать по-другому');
  await launchMix(mix, j.say);
  status((j.say || '') + '\n\nСобрал ' + mix.length + ' треков: ' + Math.min(libCount, mix.length) + ' из твоей медиатеки и остальные новые.');
}

    g('/me/top/tracks?limit=50&time_range=short_term'), g('/me/top/tracks?limit=50&time_range=medium_term'),

    g('/me/top/artists?limit=3&time_range=medium_term'), likedAll().catch(() => [])]);

    ['all', 'Топ за всё время', uniq(t3?.items || []), 30],

let likeUri = null, liked = false;
const setLike = () => { const b = $('#like'); b.hidden = false; b.textContent = liked ? '♥' : '♡'; b.classList.toggle('on', liked); };
async function checkLike(uri) {

const parseLrc = lrc => lrc.split('\n').map(l => {
  const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
  return m && {t: (+m[1] * 60 + +m[2]) * 1000, s: m[3].trim()};
}).filter(l => l && l.s);
const lrclib = (path, params) => fetch('https://lrclib.net/api/' + path + '?' + new URLSearchParams(params)).then(r => r.ok ? r.json() : null);
async function findLyrics(t, dur) {
  const artist = t.artists[0].name, title = clean(t.name), secs = Math.round(dur / 1000), al = artist.toLowerCase();
  let plain = null, instrumental = false;
  const ok = x => x && (Math.abs((x.duration || 0) - secs) <= 3 || (x.artistName || '').toLowerCase().includes(al) || al.includes((x.artistName || '').toLowerCase()));
  const note = x => { if (x?.instrumental) instrumental = true; if (!plain && x?.plainLyrics) plain = x.plainLyrics; };
  // 1. LRCLIB: точное совпадение
  const exact = await lrclib('get', {track_name: t.name, artist_name: artist, album_name: t.album.name, duration: secs}).catch(() => null);
  if (exact?.syncedLyrics) return {synced: parseLrc(exact.syncedLyrics), src: 'LRCLIB'};
  note(exact);
  // 2. LRCLIB: поиск с разными формулировками
  for (const q of [{track_name: title, artist_name: artist}, {q: artist + ' ' + title}, {q: title}]) {
    const arr = (await lrclib('search', q).catch(() => null) || []).filter(ok);
    arr.sort((a, b) => Math.abs(a.duration - secs) - Math.abs(b.duration - secs));
    const best = arr.find(x => x.syncedLyrics);
    if (best) return {synced: parseLrc(best.syncedLyrics), src: 'LRCLIB'};
    arr.forEach(note);
  }
  if (plain) return {plain, src: 'LRCLIB'};
  if (instrumental) return {instrumental: true};
  // 3. lyrics.ovh: только простой текст, без синхронизации
  try {
    const r = await fetch('https://api.lyrics.ovh/v1/' + encodeURIComponent(artist) + '/' + encodeURIComponent(title));
    const d = r.ok ? await r.json() : null;
    if (d?.lyrics?.trim()) return {plain: d.lyrics.trim(), src: 'lyrics.ovh'};
  } catch (e) {}
  return null;
}
async function loadLyrics(t, dur) {
  const id = t.id, box = $('#lyrics');
  lines = []; cur = -1; lyricRows = []; box.innerHTML = ''; box.scrollTop = 0; box.classList.remove('plain');
  let res = null;
  try { res = await findLyrics(t, dur); } catch (e) {}
  if (id !== shownId) return;
  $('#np').classList.toggle('nolyr', !(res?.synced?.length || res?.plain));
  centerArt();
  const addRow = (text, onclick) => {
    const p = document.createElement('p'), o = document.createElement('span'), tr = document.createElement('small');
    o.textContent = text; tr.className = 'tr'; p.append(o, tr);
    if (onclick) p.onclick = onclick;
    box.append(p); lyricRows.push({text, tr});
  };
  if (res?.synced?.length) {
    lines = res.synced;
    lines.forEach(l => addRow(l.s, () => player.seek(l.t)));
    box.insertAdjacentHTML('beforeend', '<p class="src">Источник: ' + esc(res.src) + '</p>');
  } else if (res?.plain) {
    box.classList.add('plain');
    res.plain.split('\n').forEach(line => { const x = line.trim(); if (x) addRow(x); else { const p = document.createElement('p'); p.className = 'gap'; box.append(p); } });
    box.insertAdjacentHTML('beforeend', '<p class="src">Текст без синхронизации. Источник: ' + esc(res.src) + '</p>');
  } else {
    const qs = encodeURIComponent(t.artists[0].name + ' ' + clean(t.name));
    box.innerHTML = res?.instrumental ? '<p class="none">Инструментальный трек, слов нет.</p>'
      : '<p class="none">Для этого трека не нашлось текста.</p><p class="src">Поискать вручную: <a href="https://genius.com/search?q=' + qs + '" target="_blank" rel="noopener">Genius</a> · <a href="https://www.google.com/search?q=' + qs + '%20текст%20песни" target="_blank" rel="noopener">Google</a></p>';
    return;
  }

}
function centerArt() {

function syncLyrics(p) {
  if (!lines.length) return;
  let i = lines.findIndex(l => l.t > p);
  i = i < 0 ? lines.length - 1 : i - 1;
  if (i === cur) return;

}
/* ---------- плавный переход между треками (затухание, затем нарастание) ---------- */
const xfSecs = () => { const v = LS.getItem('xfs'); return v === null ? 4 : +v; };
let xfMul = 1, xfPhase = 0, xfStart = 0, xfLast = 0;
const setXfVol = () => player?.setVolume(+$('#vol').value * xfMul);
function xfTick(p) {
  const secs = xfSecs();
  if (!secs || REMOTE || !player || st.paused || rep === 2 || st.dur < secs * 4000) {
    if (xfMul !== 1) { xfMul = 1; xfPhase = 0; setXfVol(); }
    return;
  }
  const left = st.dur - p, now = performance.now();
  if (xfPhase === 0 && left <= secs * 1000 && left > 400) xfPhase = 1;
  if (xfPhase === 1 && left > secs * 1000 + 500) { xfPhase = 0; xfMul = 1; setXfVol(); return; }
  if (xfPhase === 1) {
    xfMul = Math.sin(Math.max(0, Math.min(1, (left - 300) / (secs * 1000 - 300))) * Math.PI / 2);
    if (left <= 300) { xfPhase = 2; xfStart = now; xfMul = 0; player.nextTrack(); }
  } else if (xfPhase === 2) {
    const f = Math.min(1, (now - xfStart) / (secs * 1000));
    xfMul = Math.sin(f * Math.PI / 2);
    if (f >= 1) xfPhase = 0;
  } else return;
  if (now - xfLast > 80 || xfMul === 0 || xfMul === 1) { xfLast = now; setXfVol(); }
}

/* ---------- переливающийся фон полноэкранного плеера ---------- */
const rgb2hsl = (r, g, b) => {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
};
const palCache = new Map();
function getPalette(url) {
  if (!palCache.has(url)) palCache.set(url, new Promise(res => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 40;
        const x = c.getContext('2d', {willReadFrequently: true}); x.drawImage(img, 0, 0, 40, 40);
        const d = x.getImageData(0, 0, 40, 40).data, B = Array.from({length: 12}, () => ({w: 0, r: 0, g: 0, b: 0}));
        for (let i = 0; i < d.length; i += 4) {
          const [h, sat, l] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
          if (l < 0.12 || l > 0.92 || sat < 0.18) continue;
          const w = sat * (1 - Math.abs(l - 0.5)), b = B[Math.min(11, Math.floor(h * 12))];
          b.w += w; b.r += d[i] * w; b.g += d[i + 1] * w; b.b += d[i + 2] * w;
        }
        const top = B.filter(b => b.w > 0).sort((a, b) => b.w - a.w).slice(0, 4).map(b => [b.r / b.w, b.g / b.w, b.b / b.w]);
        res(top.length ? top : null);
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = url;
  }));
  return palCache.get(url);
}
async function setPalette(url, id) {
  const pal = url ? await getPalette(url) : null;
  let cols;
  if (pal) cols = pal.map(([r, g, b]) => { const [h, s, l] = rgb2hsl(r, g, b); return `hsl(${Math.round(h * 360)} ${Math.round(Math.max(s, 0.6) * 100)}% ${Math.round(Math.min(Math.max(l, 0.38), 0.6) * 100)}%)`; });
  else { let h = 0; for (const ch of String(id)) h = (h * 37 + ch.charCodeAt(0)) % 360; cols = [h, h + 40, h + 190, h + 290].map(x => `hsl(${x % 360} 70% 50%)`); }
  while (cols.length < 4) cols = cols.concat(cols).slice(0, 4);
  const bg = $('#npbg');
  cols.slice(0, 4).forEach((c, i) => bg.style.setProperty('--c' + (i + 1), c));
}

const LANGS = [['ru', 'Русский'], ['en', 'English'], ['es', 'Español'], ['de', 'Deutsch'], ['fr', 'Français'], ['it', 'Italiano'], ['pt', 'Português'], ['uk', 'Українська'], ['tr', 'Türkçe'], ['ja', '日本語'], ['ko', '한국어'], ['zh', '中文']];
