<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Музыка</title>
<style>
:root{--fg:#fff;--dim:rgba(255,255,255,.6);--faint:rgba(255,255,255,.28);--red:#fa233b;--line:rgba(255,255,255,.09);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;color:var(--fg);background:#1c1c1e;overflow:hidden;font-size:14px}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
#bg{transition:opacity .5s;position:fixed;inset:-120px;background:#2a2a2e center/cover;filter:blur(80px) saturate(1.6);transform:scale(1.15)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.62)}
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:17px;line-height:1.5;color:var(--dim);background:#1c1c1e}
.pill{background:var(--red);color:#fff;border:0;border-radius:999px;padding:11px 26px;font-weight:600;cursor:pointer}
#cid{width:min(420px,90vw);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08)}
#app{position:relative;display:grid;grid-template-columns:240px 1fr;height:calc(100% - 84px)}
#side{padding:18px 12px;overflow:auto;background:rgba(28,28,30,.5);backdrop-filter:blur(30px);border-right:1px solid var(--line)}
#q{width:100%;padding:9px 12px;border-radius:9px;border:0;background:rgba(255,255,255,.1);margin-bottom:14px}
#side a{display:block;padding:8px 10px;border-radius:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side a:hover{background:rgba(255,255,255,.07)}
#side a.on{background:rgba(255,255,255,.12);color:var(--red)}
#side h3{font-size:13px;color:var(--dim);font-weight:600;margin:18px 10px 6px}
#view{overflow:auto;padding:30px 38px 50px}
h1{font-size:30px;font-weight:700;margin-bottom:18px}
h2{font-size:21px;font-weight:700;margin:30px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px 18px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333;box-shadow:0 8px 20px rgba(0,0,0,.35);margin-bottom:8px;display:block}
.card.round img{border-radius:50%}
.card.round{text-align:center}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--dim);font-size:13px}
.row{display:grid;grid-template-columns:44px 1fr auto 28px;gap:12px;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer}
.row:hover,.row:focus-visible{background:rgba(255,255,255,.09);outline:0}
.row .n{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row img{width:44px;height:44px;border-radius:5px;display:block;object-fit:cover;background:#333}
.row div{min-width:0}
.row div b,.row div span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row div span{color:var(--dim);font-size:13px}
.row time{color:var(--dim);font-variant-numeric:tabular-nums}
.row .q{opacity:0;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--dim);border-radius:6px}
.row:hover .q,.row:focus-within .q{opacity:1}
.row .q:hover{color:#fff;background:rgba(255,255,255,.12)}
.right #like{font-size:22px;line-height:1;padding:4px 8px;background:none}
.right #like.on{color:var(--red)}
.head{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
.head img{width:230px;height:230px;border-radius:12px;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.5);background:#333}
.head.round img{border-radius:50%}
.head h1{margin:0 0 6px;font-size:34px}
.head p{color:var(--dim);margin-bottom:16px}
.msg{color:var(--dim);line-height:1.5}
#dock{position:fixed;left:0;right:0;bottom:0;height:84px;z-index:30;display:grid;grid-template-columns:1fr minmax(300px,520px) 1fr;gap:16px;align-items:center;padding:0 20px;background:rgba(28,28,30,.72);backdrop-filter:blur(30px);border-top:1px solid var(--line)}
#mini{display:flex;gap:12px;align-items:center;cursor:pointer;min-width:0}
#bArt{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#333;flex:none;transition:opacity .35s}
#mini div{min-width:0}
#mini b,#mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini span{color:var(--dim);font-size:13px}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px}
.ctl button{background:none;border:0;cursor:pointer;padding:4px;border-radius:50%;display:grid;place-items:center}
.ctl button:active{transform:scale(.9)}
.ctl svg{width:24px;height:24px;fill:currentColor}
.ctl .big svg{width:36px;height:36px}
body.paused .ic-pause,body:not(.paused) .ic-play{display:none}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.barwrap{flex:1;padding:7px 0;cursor:pointer}
#track{height:4px;border-radius:2px;background:var(--faint);overflow:hidden}
#fill{height:100%;width:0;background:#fff}
.right{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.right input{width:110px;accent-color:#fff}
.right button{background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:7px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,.barwrap:focus-visible,#mini:focus-visible{outline:2px solid #fff;outline-offset:2px}
#np{position:fixed;inset:0 0 84px 0;z-index:20;display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:6vw;align-items:center;padding:4vh 7vw;background:rgba(18,18,20,.82);backdrop-filter:blur(24px)}
#npArt{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:#333;box-shadow:0 30px 80px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .4s}
body.paused #npArt{transform:scale(.86)}
#lyrics{position:relative;height:calc(100vh - 84px - 8vh);overflow-y:auto;scrollbar-width:none;padding:34vh 0;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
#lyrics p{font-size:clamp(24px,3vw,40px);font-weight:700;line-height:1.25;padding:10px 0;color:var(--faint);cursor:pointer;transition:color .4s,transform .4s,filter .4s;filter:blur(1.2px);transform-origin:left center}
#lyrics p.on{color:#fff;transform:scale(1.04);filter:none}
#lyrics p:hover{filter:none}
#lyrics p.none{cursor:default;font-size:20px;font-weight:500}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:rgba(0,0,0,.8);padding:10px 16px;border-radius:10px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fadein{from{opacity:0}}
@keyframes dockin{from{opacity:0;transform:translateY(100%)}}
#app{animation:fadein .7s both}
#dock{animation:dockin .7s cubic-bezier(.2,.8,.2,1) .1s both}
#view{transition:opacity .2s}
#view.loading{opacity:.35;pointer-events:none}
#view>h1,#view>h2,#view>.head,#view>.msg,.card,.row{animation:rise .55s cubic-bezier(.2,.8,.2,1) var(--d,0ms) both}
#np{opacity:0;visibility:hidden;transform:translateY(24px) scale(.985);transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#np.open{opacity:1;visibility:visible;transform:none;transition:opacity .4s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
.card img{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.card:hover img{transform:scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.row{transition:background .2s}
#side a{transition:background .25s,color .25s}
.pill{transition:transform .15s,filter .2s}
.pill:hover{filter:brightness(1.12)}
.pill:active{transform:scale(.97)}
.pill.ghost{background:rgba(255,255,255,.14)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.ctl button{position:relative;transition:transform .12s,color .25s}
.ctl #shuf svg,.ctl #rep svg{width:20px;height:20px}
.ctl #shuf,.ctl #rep{color:var(--dim)}
.ctl .on{color:var(--red)!important}
#rep.one::after{content:"1";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:700}
@media(max-width:820px){#app{grid-template-columns:1fr}#side{display:none}#dock{grid-template-columns:1fr auto}.mid .prog,.right input{display:none}#np{grid-template-columns:1fr}#npArt{display:none}.head{flex-direction:column;align-items:flex-start}#view{padding:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<div id="gate">
  <p id="gateText"></p>
  <input id="cid" placeholder="Client ID из Spotify Dashboard" autocomplete="off" hidden>
  <button class="pill" id="saveCid" hidden>Сохранить</button>
  <button class="pill" id="loginBtn" hidden>Войти через Spotify</button>
</div>

<div id="app" hidden>
  <aside id="side">
    <input id="q" type="search" placeholder="Поиск" aria-label="Поиск">
    <a href="#home">Главная</a>
    <a href="#queue">Очередь</a>
    <h3>Медиатека</h3>
    <a href="#tracks">Любимые треки</a>
    <a href="#albums">Альбомы</a>
    <a href="#artists">Артисты</a>
    <a href="#shows">Подкасты</a>
    <h3>Плейлисты</h3>
    <div id="pls"></div>
  </aside>
  <main id="view"></main>
</div>

<section id="np">
  <img id="npArt" alt="Обложка">
  <div id="lyrics" aria-label="Текст песни"></div>
</section>

<footer id="dock" hidden>
  <div id="mini" role="button" tabindex="0" aria-label="Открыть текст песни">
    <img id="bArt" alt=""><div><b id="bTitle">Ничего не играет</b><span id="bArtist">Включи что-нибудь из списка</span></div>
  </div>
  <div class="mid">
    <div class="ctl">
      <button id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
      <button id="prev" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
      <button id="toggle" class="big" aria-label="Играть или пауза">
        <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="next" aria-label="Следующий трек"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
      <button id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
    </div>
    <div class="prog"><span id="tNow">0:00</span><div class="barwrap" id="seek"><div id="track"><div id="fill"></div></div></div><span id="tEnd">0:00</span></div>
  </div>
  <div class="right"><button id="like" aria-label="Добавить в любимые" hidden>♡</button><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Громкость"><button id="npBtn">Текст</button></div>
</footer>
<p id="toast" hidden></p>

<script>
/* ====== НАСТРОЙКИ ====== */
const CLIENT_ID = 'd92c4e464cf84953a09fbcb179e2d81d';
/* ======================== */
const LS = localStorage, $ = s => document.querySelector(s);
const REDIRECT = location.origin + location.pathname, SV = '4';
const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state user-read-recently-played user-top-read user-library-read user-library-modify user-follow-read playlist-read-private playlist-read-collaborative';
let CID = CLIENT_ID.startsWith('ВСТАВЬ') ? LS.getItem('cid') : CLIENT_ID, player, devId, sdkReady = false, authed = false;
let shownId = null, lines = [], cur = -1, snap = false;
let curCtx = null, curTracks = [], more = null, rid = 0;
let st = {pos: 0, at: 0, paused: true, dur: 1}, shuf = false, rep = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const pic = (o, i = 1) => { const a = o?.images || o?.album?.images || []; return a[Math.min(i, a.length - 1)]?.url || ''; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.id); toast.id = setTimeout(() => t.hidden = true, 5000); }
function gate(text, mode) {
  $('#gateText').textContent = text;
  $('#cid').hidden = $('#saveCid').hidden = mode !== 'cid';
  $('#loginBtn').hidden = mode !== 'login';
  $('#gate').hidden = false;
}

/* ---------- авторизация (PKCE) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
async function login() {
  const verifier = b64(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  LS.setItem('verifier', verifier);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: CID, scope: SCOPES, redirect_uri: REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge
  });
}
async function tokenRequest(params) {
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({client_id: CID, ...params})
  });
  if (!r.ok) throw new Error('auth');
  const d = await r.json();
  LS.setItem('access', d.access_token);
  if (d.refresh_token) LS.setItem('refresh', d.refresh_token);
  LS.setItem('exp', Date.now() + d.expires_in * 1000 - 60000);
}
async function getToken() {
  if (Date.now() < +LS.getItem('exp')) return LS.getItem('access');
  await tokenRequest({grant_type: 'refresh_token', refresh_token: LS.getItem('refresh')});
  return LS.getItem('access');
}
const dropTokens = () => ['access', 'refresh', 'exp', 'sv'].forEach(k => LS.removeItem(k));

async function get(p) {
  const r = await fetch(p.startsWith('http') ? p : 'https://api.spotify.com/v1' + p, {headers: {Authorization: 'Bearer ' + await getToken()}});
  if (!r.ok) throw new Error(r.status === 403 ? 'Spotify не отдаёт эти данные приложениям в Development Mode (403).' : 'Ошибка Spotify: ' + r.status);
  return r.json();
}
const g = p => get(p).catch(() => null);
async function api(method, path, body) {
  return fetch('https://api.spotify.com/v1' + path, {
    method, headers: {Authorization: 'Bearer ' + await getToken(), 'Content-Type': 'application/json'},
    body: body && JSON.stringify(body)
  });
}
async function play(body) {
  if (!devId) return toast('Плеер ещё подключается, подожди секунду');
  const r = await api('PUT', '/me/player/play?device_id=' + devId, body);
  if (!r.ok) toast('Не удалось включить (' + r.status + ')');
}

/* ---------- элементы интерфейса ---------- */
const card = (go, o, sub, round) => `<a class="card${round ? ' round' : ''}" href="#${go}"><img loading="lazy" src="${esc(pic(o, 1))}" alt=""><b>${esc(o.name)}</b><span>${esc(sub)}</span></a>`;
const row = (t, i, art) => `<div class="row" tabindex="0" data-i="${i}" data-u="${esc(t.uri)}"><span class="n">${art ? `<img src="${esc(pic(t, 2))}" alt="">` : i + 1}</span><div><b>${esc(t.name)}</b><span>${esc((t.artists || []).map(a => a.name).join(', ') || t.release_date || '')}</span></div><time>${fmt(t.duration_ms || 0)}</time><button class="q" data-q="${esc(t.uri)}" aria-label="В очередь" title="В очередь">+</button></div>`;
const list = (ts, art) => { curTracks = ts.map(t => t.uri); return ts.map((t, i) => row(t, i, art)).join(''); };
const head = (o, t, s, round) => `<div class="head${round ? ' round' : ''}"><img src="${esc(pic(o, 0))}" alt=""><div><h1>${esc(t)}</h1><p>${esc(s)}</p><div class="acts"><button class="pill playall">Слушать</button><button class="pill ghost shufall">Перемешать</button></div></div></div>`;
const moreBtn = () => more ? '<p style="text-align:center;margin-top:24px"><button class="pill" id="more">Показать ещё</button></p>' : '';
const yr = o => (o.release_date || '').slice(0, 4);

/* ---------- страницы ---------- */
async function home() {
  const [rec, ta, tt, pl] = await Promise.all([
    g('/me/player/recently-played?limit=40'), g('/me/top/artists?limit=10&time_range=short_term'),
    g('/me/top/tracks?limit=10&time_range=short_term'), g('/me/playlists?limit=12')]);
  let h = '<h1>Главная</h1>';
  if (rec?.items?.length) {
    const seen = new Set(), al = [];
    rec.items.forEach(x => { const a = x.track.album; if (a && !seen.has(a.id)) { seen.add(a.id); al.push(card('album/' + a.id, a, x.track.artists[0].name)); } });
    h += '<h2>Недавно слушали</h2><div class="grid">' + al.slice(0, 12).join('') + '</div>';
  }
  if (ta?.items?.length) h += '<h2>Ваши артисты</h2><div class="grid">' + ta.items.map(a => card('artist/' + a.id, a, 'Артист', 1)).join('') + '</div>';
  if (tt?.items?.length) h += '<h2>Ваши треки</h2>' + list(tt.items, 1);
  if (pl?.items?.length) h += '<h2>Ваши плейлисты</h2><div class="grid">' + pl.items.filter(Boolean).map(p => card('playlist/' + p.id, p, 'Плейлист')).join('') + '</div>';
  return h.length > 20 ? h : h + '<p class="msg">Пока нечего показать. Послушай что-нибудь, и здесь появится твоя музыка.</p>';
}
async function searchView(q) {
  $('#q').value = q;
  if (!q) return '<h1>Поиск</h1><p class="msg">Введи запрос в поле слева и нажми Enter.</p>';
  const d = await get('/search?' + new URLSearchParams({q, type: 'track,artist,album,playlist', limit: 10}));
  const ts = (d.tracks?.items || []).filter(Boolean), ar = (d.artists?.items || []).filter(Boolean);
  const al = (d.albums?.items || []).filter(Boolean), pl = (d.playlists?.items || []).filter(Boolean);
  let h = '<h1>Результаты: ' + esc(q) + '</h1>';
  if (ts.length) h += '<h2>Треки</h2>' + list(ts, 1);
  if (ar.length) h += '<h2>Артисты</h2><div class="grid">' + ar.map(a => card('artist/' + a.id, a, 'Артист', 1)).join('') + '</div>';
  if (al.length) h += '<h2>Альбомы</h2><div class="grid">' + al.map(a => card('album/' + a.id, a, a.artists[0].name)).join('') + '</div>';
  if (pl.length) h += '<h2>Плейлисты</h2><div class="grid">' + pl.map(p => card('playlist/' + p.id, p, 'Плейлист')).join('') + '</div>';
  return h.length > 40 + q.length ? h : h + '<p class="msg">Ничего не нашлось.</p>';
}
async function tracks() {
  const d = await get('/me/tracks?limit=50');
  more = d.next ? {url: d.next, kind: 't'} : null;
  return '<h1>Любимые треки</h1><div id="list">' + list(d.items.map(x => x.track).filter(Boolean), 1) + '</div>' + moreBtn();
}
async function albums() {
  const d = await get('/me/albums?limit=50');
  more = d.next ? {url: d.next, kind: 'a'} : null;
  return '<h1>Альбомы</h1><div class="grid" id="list">' + d.items.map(x => card('album/' + x.album.id, x.album, x.album.artists[0].name)).join('') + '</div>' + moreBtn();
}
async function artists() {
  const d = await get('/me/following?type=artist&limit=50');
  return '<h1>Артисты</h1><div class="grid">' + d.artists.items.map(a => card('artist/' + a.id, a, 'Артист', 1)).join('') + '</div>';
}
async function album(id) {
  const a = await get('/albums/' + id);
  curCtx = a.uri;
  const ts = a.tracks.items;
  curTracks = ts.map(t => t.uri);
  return head(a, a.name, a.artists.map(x => x.name).join(', ') + ' · ' + yr(a)) + ts.map((t, i) => row(t, i)).join('');
}
async function playlist(id) {
  const p = await get('/playlists/' + id);
  curCtx = p.uri;
  const ts = (p.items?.items || p.tracks?.items || []).map(x => x.item || x.track).filter(t => t && t.uri);
  curTracks = ts.map(t => t.uri);
  return head(p, p.name, (p.owner?.display_name || '') + (ts.length ? ' · ' + ts.length + ' треков' : '')) +
    (ts.length ? ts.map((t, i) => row(t, i, 1)).join('') : '<p class="msg">Spotify не отдаёт состав этого плейлиста сторонним приложениям, но его можно слушать целиком кнопкой «Слушать».</p>');
}
async function artist(id) {
  const [a, al] = await Promise.all([get('/artists/' + id), get('/artists/' + id + '/albums?include_groups=album,single&limit=20')]);
  curCtx = a.uri;
  return head(a, a.name, 'Артист', 1) + '<h2>Релизы</h2><div class="grid">' +
    al.items.map(x => card('album/' + x.id, x, yr(x) + ' · ' + (x.album_type === 'single' ? 'Сингл' : 'Альбом'))).join('') + '</div>';
}
async function shows() {
  const d = await get('/me/shows?limit=50');
  return '<h1>Подкасты</h1>' + (d.items.length ? '<div class="grid">' + d.items.map(x => card('show/' + x.show.id, x.show, 'Подкаст')).join('') + '</div>' : '<p class="msg">Ты пока не подписан ни на один подкаст.</p>');
}
async function show(id) {
  const [s, e] = await Promise.all([get('/shows/' + id), get('/shows/' + id + '/episodes?limit=50')]);
  curCtx = s.uri;
  const eps = e.items.filter(Boolean);
  curTracks = eps.map(x => x.uri);
  return head(s, s.name, 'Подкаст') + eps.map((x, i) => row(x, i, 1)).join('');
}
async function queue() {
  const d = await get('/me/player/queue');
  const q = (d.queue || []).filter(t => t && t.uri), now = d.currently_playing, off = now ? 1 : 0;
  curTracks = (now ? [now] : []).concat(q).map(t => t.uri);
  return '<h1>Очередь</h1>' + (now ? '<h2>Сейчас играет</h2>' + row(now, 0, 1) : '') +
    '<h2>Далее</h2>' + (q.length ? q.map((t, i) => row(t, i + off, 1)).join('') : '<p class="msg">Очередь пуста. Нажми «+» справа у любого трека, чтобы добавить его.</p>');
}
const routes = {home, search: searchView, tracks, albums, artists, album, playlist, artist, shows, show, queue};

async function route() {
  if (!authed) return;
  const my = ++rid;
  curCtx = null; curTracks = []; more = null; $('#np').classList.remove('open');
  const h = decodeURIComponent((location.hash || '#home').slice(1)), i = h.indexOf('/');
  const name = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : h.slice(i + 1);
  document.querySelectorAll('#side a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === (location.hash || '#home')));
  const V = $('#view');
  V.classList.add('loading');
  try {
    const html = await (routes[name] || home)(arg);
    if (my !== rid) return;
    V.innerHTML = html; V.scrollTop = 0; V.classList.remove('loading');
    V.querySelectorAll('h1,h2,.head,.card,.row,.msg').forEach((el, i) => el.style.setProperty('--d', Math.min(i, 20) * 30 + 'ms'));
  } catch (e) { if (my === rid) { V.classList.remove('loading'); V.innerHTML = '<p class="msg">' + esc(e.message) + '</p>'; } }
}
addEventListener('hashchange', route);

document.addEventListener('click', async e => {
  const qb = e.target.closest('.q');
  if (qb) { const x = await api('POST', '/me/player/queue?uri=' + encodeURIComponent(qb.dataset.q) + (devId ? '&device_id=' + devId : '')); return toast(x.ok ? 'Добавлено в очередь' : 'Не удалось добавить (' + x.status + ')'); }
  const r = e.target.closest('.row');
  if (r) return curCtx ? play({context_uri: curCtx, offset: {uri: r.dataset.u}}) : play({uris: curTracks.slice(+r.dataset.i, +r.dataset.i + 100)});
  if (e.target.closest('.shufall')) { shuf = true; setModes(); await api('PUT', '/me/player/shuffle?state=true' + dq()); return curCtx ? play({context_uri: curCtx}) : play({uris: curTracks.slice(0, 100)}); }
  if (e.target.closest('.playall')) return curCtx ? play({context_uri: curCtx}) : play({uris: curTracks.slice(0, 100)});
  if (e.target.id === 'more' && more) {
    const m = more, b = e.target; b.disabled = true;
    try {
      const d = await get(m.url);
      more = d.next ? {url: d.next, kind: m.kind} : null;
      if (m.kind === 't') {
        const ts = d.items.map(x => x.track).filter(Boolean), s = curTracks.length;
        curTracks.push(...ts.map(t => t.uri));
        $('#list').insertAdjacentHTML('beforeend', ts.map((t, i) => row(t, s + i, 1)).join(''));
      } else $('#list').insertAdjacentHTML('beforeend', d.items.map(x => card('album/' + x.album.id, x.album, x.album.artists[0].name)).join(''));
      if (more) b.disabled = false; else b.parentElement.remove();
    } catch (err) { toast(err.message); b.disabled = false; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('row')) e.target.click();
  if (e.key === 'Escape') $('#np').classList.remove('open');
  if (e.code === 'Space' && e.target === document.body && player) { e.preventDefault(); player.togglePlay(); }
});
$('#q').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) location.hash = '#search/' + encodeURIComponent(e.target.value.trim()); };

/* ---------- плеер ---------- */
function startPlayer() {
  player = new Spotify.Player({name: 'Custom Player', getOAuthToken: async cb => cb(await getToken()), volume: 0.7});
  player.addListener('ready', ({device_id}) => { devId = device_id; api('PUT', '/me/player', {device_ids: [device_id], play: false}); });
  player.addListener('player_state_changed', onState);
  ['initialization_error', 'authentication_error', 'account_error', 'playback_error'].forEach(e => player.addListener(e, ({message}) => toast(message)));
  player.connect();
}
function onState(s) {
  if (!s || !s.track_window.current_track) return;
  const t = s.track_window.current_track;
  st = {pos: s.position, at: performance.now(), paused: s.paused, dur: s.duration};
  document.body.classList.toggle('paused', s.paused);
  shuf = s.shuffle; rep = s.repeat_mode; setModes();
  if (t.id !== shownId) {
    shownId = t.id;
    const img = t.album.images[0]?.url || '';
    $('#bTitle').textContent = t.name;
    $('#bArtist').textContent = t.artists.map(a => a.name).join(', ');
    ['#bArt', '#npArt'].forEach(id => { const el = $(id); el.style.opacity = 0; el.onload = el.onerror = () => el.style.opacity = 1; el.src = img; });
    const bg = $('#bg'); bg.style.opacity = 0;
    setTimeout(() => { bg.style.backgroundImage = `url("${img}")`; bg.style.opacity = 1; }, 380);
    $('#tEnd').textContent = fmt(s.duration);
    loadLyrics(t, s.duration);
    checkLike(t.uri);
  }
}
let likeUri = null, liked = false;
const setLike = () => { const b = $('#like'); b.hidden = false; b.textContent = liked ? '♥' : '♡'; b.classList.toggle('on', liked); };
async function checkLike(uri) {
  likeUri = uri;
  const d = await g('/me/library/contains?uris=' + encodeURIComponent(uri));
  if (likeUri === uri && d) { liked = !!d[0]; setLike(); }
}
$('#like').onclick = async () => {
  if (!likeUri) return;
  const r = await api(liked ? 'DELETE' : 'PUT', '/me/library?uris=' + encodeURIComponent(likeUri));
  if (r.ok) { liked = !liked; setLike(); } else toast('Не удалось изменить (' + r.status + ')');
};
const position = () => st.paused ? st.pos : Math.min(st.pos + performance.now() - st.at, st.dur);

async function loadLyrics(t, dur) {
  const id = t.id, box = $('#lyrics');
  lines = []; cur = -1; box.innerHTML = ''; box.scrollTop = 0;
  try {
    const q = new URLSearchParams({track_name: t.name, artist_name: t.artists[0].name, album_name: t.album.name, duration: Math.round(dur / 1000)});
    const r = await fetch('https://lrclib.net/api/get?' + q);
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!d.syncedLyrics) throw 0;
    lines = d.syncedLyrics.split('\n').map(l => {
      const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
      return m && {t: (+m[1] * 60 + +m[2]) * 1000, s: m[3].trim()};
    }).filter(l => l && l.s);
  } catch (e) {}
  if (id !== shownId) return;
  if (!lines.length) { box.innerHTML = '<p class="none">Для этого трека нет синхронного текста.</p>'; return; }
  lines.forEach(l => { const p = document.createElement('p'); p.textContent = l.s; p.onclick = () => player.seek(l.t); box.append(p); });
}
function syncLyrics(p) {
  if (!lines.length) return;
  let i = lines.findIndex(l => l.t > p);
  i = i < 0 ? lines.length - 1 : i - 1;
  if (i === cur) return;
  const box = $('#lyrics');
  box.children[cur]?.classList.remove('on');
  cur = i;
  const el = box.children[i];
  if (!el) return;
  el.classList.add('on');
  box.scrollTo({top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2, behavior: snap ? 'auto' : 'smooth'});
  snap = false;
}
(function loop() {
  const p = position();
  $('#fill').style.width = (p / st.dur * 100) + '%';
  $('#tNow').textContent = fmt(p);
  if ($('#np').classList.contains('open')) syncLyrics(p);
  requestAnimationFrame(loop);
})();

const toggleNp = () => { const np = $('#np'); np.classList.toggle('open'); if (np.classList.contains('open')) { cur = -1; snap = true; } };
$('#mini').onclick = $('#npBtn').onclick = toggleNp;
$('#mini').onkeydown = e => { if (e.key === 'Enter') toggleNp(); };
const dq = () => devId ? '&device_id=' + devId : '';
const setModes = () => { $('#shuf').classList.toggle('on', shuf); $('#rep').classList.toggle('on', rep > 0); $('#rep').classList.toggle('one', rep === 2); };
$('#shuf').onclick = () => { shuf = !shuf; setModes(); api('PUT', '/me/player/shuffle?state=' + shuf + dq()); };
$('#rep').onclick = () => { const n = ['context', 'track', 'off'][rep]; rep = (rep + 1) % 3; setModes(); api('PUT', '/me/player/repeat?state=' + n + dq()); };
$('#prev').onclick = () => player?.previousTrack();
$('#next').onclick = () => player?.nextTrack();
$('#toggle').onclick = () => player?.togglePlay();
$('#vol').oninput = e => player?.setVolume(+e.target.value);
$('#seek').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); player?.seek(Math.round((e.clientX - r.left) / r.width * st.dur)); };

/* ---------- старт ---------- */
$('#loginBtn').onclick = login;
$('#saveCid').onclick = () => { const v = $('#cid').value.trim(); if (v) { LS.setItem('cid', v); CID = v; init(); } };
window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; if (authed) startPlayer(); };

async function init() {
  try {
    if (!CID) return gate('Вставь Client ID своего приложения из Spotify Dashboard (вкладка Basic Information). Это нужно один раз.', 'cid');
    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      await tokenRequest({grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: LS.getItem('verifier')});
      LS.setItem('sv', SV);
      history.replaceState({}, '', REDIRECT);
    } else if (LS.getItem('sv') !== SV) dropTokens();
    if (!LS.getItem('refresh')) return gate('Войди в аккаунт Spotify Premium. Приложению нужны новые разрешения для медиатеки и истории.', 'login');
    authed = true;
    $('#gate').hidden = true; $('#app').hidden = false; $('#dock').hidden = false;
    document.body.classList.add('paused');
    route();
    if (sdkReady) startPlayer();
    g('/me/playlists?limit=50').then(d => { if (d) $('#pls').innerHTML = d.items.filter(Boolean).map(p => `<a href="#playlist/${esc(p.id)}">${esc(p.name)}</a>`).join(''); });
  } catch (e) {
    dropTokens();
    gate('Не получилось войти. Проверь Client ID и попробуй ещё раз.', 'login');
  }
}
init();
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
